function reset(){p={x:70,y:300,v:0};score=0;life=3;count=0;cam=0;inv=0;ground=false;jumpHeld=false;books=[];blocks=[];for(let i=0;i<40;i++){let x=230+i*190;books.push({x,y:i%3===1?295:365,got:false});if(i%3===1)blocks.push({x:x-45,y:340,w:100,h:18,type:'platform'});if(i%4===2)blocks.push({x:x+65,y:390,w:38,h:30,type:'hazard'})}mode='play';overlay.style.display='none';}
start.onclick=reset;function finish(win){mode='end';best=Math.max(best,score);try{localStorage.setItem('profBest',best)}catch(e){};heading.textContent=win?'🎉 知識大師！':'挑戰結束';message.textContent=`分數 ${score} ｜ 最高紀錄 ${best}`;answers.replaceChildren();start.style.display='';start.textContent='再玩一次';overlay.style.display='flex'}

function update(){let old=p.y;p.x=Math.max(20,p.x+((keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0))*4.5);let j=keys.Space||keys.ArrowUp||keys.KeyW;if(j&&!jumpHeld&&ground)p.v=-12;jumpHeld=j;p.v+=.55;p.y+=p.v;ground=false;if(p.y>=420-70){p.y=350;p.v=0;ground=true}for(let b of blocks){if(b.type==='platform'&&p.x+34>b.x&&p.x<b.x+b.w&&old+70<=b.y&&p.y+70>=b.y&&p.v>=0){p.y=b.y-70;p.v=0;ground=true}if(b.type==='hazard'&&inv<=0&&p.x+34>b.x&&p.x<b.x+b.w&&p.y+70>b.y){life--;inv=100;p.v=-8;if(!life){finish(false);return}}}inv--;cam=Math.max(0,p.x-260);for(let b of books){if(!b.got&&Math.abs(p.x+17-b.x)<35&&Math.abs(p.y+35-b.y)<45){b.got=true;score+=10;count++;if(count%5===0){quiz();break}}}if(p.x>7900&&mode==='play')finish(true)}
